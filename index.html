</script>
<style>
:root{
  --navy:#0b1a2e; --navy2:#0a1828;
  --indigo:#55489f; --emerald:#11a272;
  --paper:#f4f6f9; --ink:#0f1b2d;
  --sub-l:#66748a; --sub-d:#8a97a8;
  --line:#e4e8ef; --panel:#ffffff; --bg:#eef1f6;
  --accent:#11a272;
  --shadow:0 1px 3px rgba(16,27,45,.08),0 8px 30px rgba(16,27,45,.06);
  font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

/* top bar */
.topbar{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--ink)}
.brandmark svg{height:26px;width:auto;display:block}
.brandmark .tag{font-weight:300;color:var(--sub-l);font-size:12px;margin-left:2px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{border-color:#c9d2df;background:#fafbfc}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#1c2b40}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sub-l)}
.btn.ghost:hover{color:var(--ink);background:#f0f3f8}
.btn:focus-visible{outline:3px solid rgba(85,72,159,.4);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* layout */
.app{display:grid;grid-template-columns:230px 1fr 360px;height:calc(100vh - 55px);min-height:0}
.rail,.editor{background:var(--panel);overflow-y:auto}
.rail{border-right:1px solid var(--line);padding:14px 12px}
.editor{border-left:1px solid var(--line);padding:18px 18px 60px}
.stage{display:flex;align-items:center;justify-content:center;padding:26px;overflow:auto;background:var(--bg)}
.stage-inner{width:min(72vh,560px);aspect-ratio:1/1;box-shadow:var(--shadow);border-radius:8px;overflow:hidden;background:#fff}
.stage-inner svg{width:100%;height:100%;display:block}

/* rail */
.rail h3,.editor h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub-l);font-weight:700;margin:2px 4px 12px}
.add-menu{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.add-menu button{font-size:11.5px;padding:8px 4px;border:1px dashed #c7d0dd;border-radius:9px;background:#fbfcfe;color:var(--sub-l);font-weight:600}
.add-menu button:hover{border-color:var(--indigo);color:var(--indigo);background:#fff}
.thumb{position:relative;border:2px solid transparent;border-radius:10px;overflow:hidden;margin-bottom:10px;cursor:pointer;background:#fff;box-shadow:0 1px 2px rgba(16,27,45,.06)}
.thumb.sel{border-color:var(--indigo)}
.thumb .num{position:absolute;top:5px;left:7px;font-size:10px;font-weight:700;color:#fff;background:rgba(11,26,46,.55);padding:1px 6px;border-radius:20px;letter-spacing:.05em}
.thumb svg{width:100%;height:100%;display:block}
.thumb .ops{position:absolute;inset:auto 5px 5px auto;display:none;gap:3px}
.thumb:hover .ops{display:flex}
.thumb .ops button{width:24px;height:24px;border-radius:6px;border:none;background:rgba(255,255,255,.92);color:#334;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.thumb .ops button:hover{background:#fff;color:var(--indigo)}

/* editor fields */
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field .hint{font-weight:400;color:var(--sub-l);font-size:11px}
.field input[type=text],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--ink);background:#fff;resize:vertical}
.field textarea{min-height:64px;line-height:1.45}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(85,72,159,.12)}
.tmpl-name{font-size:19px;font-weight:700;margin:0 0 3px}
.tmpl-sub{font-size:12px;color:var(--sub-l);margin:0 0 18px}
.seg{display:inline-flex;background:#eef1f6;border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--sub-l)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.filepick{display:flex;align-items:center;gap:10px}
.thumbimg{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:#eef1f6}
.tipbox{font-size:11.5px;color:var(--sub-l);background:#f4f6f9;border:1px solid var(--line);border-radius:9px;padding:9px 11px;line-height:1.5}
.tipbox b{color:var(--ink)}
.empty{color:var(--sub-l);text-align:center;padding:40px 10px;font-size:13px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(11,26,46,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:26px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin:0 0 4px;font-size:18px}
.modal p.m-sub{margin:0 0 18px;color:var(--sub-l);font-size:13px}
.loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:100}
.spin{width:34px;height:34px;border:3px solid #d8e0ea;border-top-color:var(--indigo);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mobtabs{display:none}

@media(max-width:900px){
  .app{grid-template-columns:1fr;height:auto;grid-template-rows:auto}
  .rail,.editor,.stage{border:none;border-bottom:1px solid var(--line)}
  .rail{order:3;padding:14px 16px}
  #thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stage{order:1;position:sticky;top:55px;background:var(--bg);z-index:10}
  .stage-inner{width:min(78vw,340px)}
  .editor{order:2}
  .topbar{flex-wrap:wrap}
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spin"></div>
  <div style="color:var(--sub-l);font-size:13px">Cargando fuentes…</div>
</div>

<div class="topbar">
  <div class="brandmark" id="topLogo"></div>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnBrand">Marca</button>
  <button class="btn" id="btnDlOne">Descargar slide</button>
  <button class="btn primary" id="btnDlAll">Descargar todos</button>
</div>

<div class="app">
  <!-- LEFT RAIL -->
  <aside class="rail">
    <div class="railhead"><h3>Carrusel</h3></div>
    <div class="add-menu" id="addMenu">
      <button data-t="portada">+ Portada</button>
      <button data-t="texto">+ Texto</button>
      <button data-t="foto">+ Con foto</button>
      <button data-t="dato">+ Dato</button>
      <button data-t="cierre">+ Cierre</button>
      <button data-t="imagen">+ Imagen</button>
    </div>
    <div id="thumbs"></div>
  </aside>

  <!-- CENTER STAGE -->
  <main class="stage">
    <div class="stage-inner"><div id="stageSvg"></div></div>
  </main>

  <!-- RIGHT EDITOR -->
  <aside class="editor" id="editor"></aside>
</div>

<!-- Brand modal -->
<div class="modal-bg" id="brandModal">
  <div class="modal">
    <h2>Logo de marca</h2>
    <p class="m-sub">Por defecto se usa el logo vectorial de Andes Energy. Puedes subir tu propio logo (PNG con fondo transparente) para fondos claros y oscuros.</p>
    <div class="field">
      <label>Logo para fondos claros</label>
      <div class="filepick"><img class="thumbimg" id="logoLightPrev" alt=""><input type="file" accept="image/*" id="logoLight"></div>
    </div>
    <div class="field">
      <label>Logo para fondos oscuros</label>
      <div class="filepick"><img class="thumbimg" id="logoDarkPrev" alt=""><input type="file" accept="image/*" id="logoDark"></div>
    </div>
    <div class="row" style="margin-top:20px">
      <button class="btn ghost" id="logoReset">Volver al logo por defecto</button>
      <button class="btn primary" id="brandDone">Listo</button>
    </div>
  </div>
</div>

/* ---- utilidades ---- */
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let gradSeq=0;

function b64buf(b64){const bin=atob(b64);const n=bin.length;const buf=new ArrayBuffer(n);const v=new Uint8Array(buf);for(let i=0;i<n;i++)v[i]=bin.charCodeAt(i);return buf;}

/* medir ancho de una línea de texto en px */
function measure(weight, text, size){
  const f=FONTS[weight]; const s=size/f.unitsPerEm; let w=0;
  for(const ch of text){ w += f.charToGlyph(ch).advanceWidth*s; }
  return w;
}
/* altura de mayúsculas aprox (cap height) para centrar visual */
function capHeight(weight,size){const f=FONTS[weight];const H=f.tables.os2&&f.tables.os2.sCapHeight?f.tables.os2.sCapHeight:700;return H/f.unitsPerEm*size;}

/* dividir "*grad*" en segmentos {text,grad} */
function parseSegs(line){
  const out=[]; let i=0, grad=false, cur="";
  for(const ch of line){
    if(ch==="*"){ if(cur){out.push({text:cur,grad});cur="";} grad=!grad; }
    else cur+=ch;
  }
  if(cur)out.push({text:cur,grad});
  return out.length?out:[{text:"",grad:false}];
}
function stripStars(s){return (s||"").replace(/\*/g,"");}

/* generar paths + defs para una línea; devuelve {paths, defs, width} */
function lineToSvg(weight, segs, x0, baseY, size, solidColor){
  const f=FONTS[weight]; const s=size/f.unitsPerEm;
  let x=x0, paths="", defs="";
  for(const seg of segs){
    if(!seg.text) continue;
    const segStart=x; let d="";
    for(const ch of seg.text){
      const g=f.charToGlyph(ch);
      d += g.getPath(x, baseY, size).toPathData(2)+" ";
      x += g.advanceWidth*s;
    }
    let fill=solidColor;
    if(seg.grad){
      const id="g"+(gradSeq++);
      const x1=segStart, x2=x;
      defs+=`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${x1.toFixed(1)}" y1="0" x2="${x2.toFixed(1)}" y2="0">`
          +`<stop offset="0" stop-color="${C.grad[0]}"/><stop offset="0.5" stop-color="${C.grad[1]}"/><stop offset="1" stop-color="${C.grad[2]}"/></linearGradient>`;
      fill=`url(#${id})`;
    }
    paths+=`<path d="${d}" fill="${fill}"/>`;
  }
  return {paths,defs,width:x-x0};
}

/* word-wrap a un ancho máximo, respetando saltos explícitos */
function wrapLines(weight, text, size, maxW){
  const out=[];
  (text||"").split("\n").forEach(para=>{
    if(para.trim()===""){out.push("");return;}
    const words=para.split(/\s+/); let cur="";
    for(const w of words){
      const test=cur?cur+" "+w:w;
      if(measure(weight,test,size)>maxW && cur){ out.push(cur); cur=w; }
      else cur=test;
    }
    if(cur)out.push(cur);
  });
  return out;
}

/* flecha vectorial → */
function arrow(x, cy, size, color){
  const len=size*0.85, tip=x+len, hw=size*0.30, sw=Math.max(2,size*0.085);
  return `<path d="M ${x} ${cy} H ${tip} M ${tip-hw} ${cy-hw} L ${tip} ${cy} L ${tip-hw} ${cy+hw}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

/* ---- LOGO ---- */
function logoSvg(x, topY, height, dark, custom){
  if(custom){
    const ratio=custom.w/custom.h; const w=height*ratio;
    return {svg:`<image href="${custom.src}" x="${x}" y="${topY}" width="${w}" height="${height}"/>`, width:w};
  }
  // monograma
  const scale=height/LOGO_VB.h;
  const mw=LOGO_VB.w*scale;
  const tx=x-LOGO_VB.x*scale, ty=topY-LOGO_VB.y*scale;
  const aCol = dark?"#7b6fc4":C.indigo;
  const eCol = C.emerald;
  let g=`<g transform="translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${scale.toFixed(4)})">`
      +`<path d="${LOGO_A}" fill="${aCol}"/><path d="${LOGO_E1}" fill="${eCol}"/><path d="${LOGO_E2}" fill="${eCol}"/></g>`;
  // wordmark andes.energy  (vectorizado, weight 600)
  const wmSize=height*0.55;
  const gap=height*0.34;
  let wx=x+mw+gap;
  const baseY=topY+height*0.5+capHeight(600,wmSize)*0.5;
  const wmInk = dark?"#ffffff":C.ink;
  const dotCol = dark?C.emerald:C.indigo;
  const p1=lineToSvg(600,[{text:"andes",grad:false}],wx,baseY,wmSize,wmInk);
  wx+=p1.width;
  const p2=lineToSvg(700,[{text:".",grad:false}],wx,baseY,wmSize,dotCol);
  wx+=p2.width;
  const p3=lineToSvg(600,[{text:"energy",grad:false}],wx,baseY,wmSize,wmInk);
  wx+=p3.width;
  g+=p1.paths+p2.paths+p3.paths;
  return {svg:g, defs:"", width:(wx-x)};
}

/* ---- construir un slide completo ---- */
function buildSlide(slide, pageNum, total){
  gradSeq=0;
  const t=slide.template;
  const dark = slide.dark;
  const isPhoto = t==="imagen";              // full-bleed: siempre tratamiento oscuro
  const visualDark = dark || isPhoto;
  const bg = visualDark?C.navy:C.paper;
  const inkCol = isPhoto?"#ffffff":(dark?"#ffffff":C.ink);
  const subCol = isPhoto?"rgba(255,255,255,0.86)":(dark?C.subDark:C.subLight);
  const eyeCol = visualDark?C.eyebrowDark:C.eyebrowLight;
  const footCol = isPhoto?"rgba(255,255,255,0.62)":(dark?C.footDark:C.footLight);
  const custom = visualDark?BRAND.dark:BRAND.light;
  let defs="", body="", bgExtra="";
  const emojis=[]; // {char,x,baseY,size}

  // FONDO full-bleed (plantilla imagen) — se pinta detrás del logo/pie
  if(isPhoto){
    const photo = slide.image || DEFAULT_PHOTO;
    bgExtra += `<image href="${photo}" x="0" y="0" width="${CANVAS}" height="${CANVAS}" preserveAspectRatio="xMidYMid slice"/>`;
    const scId="sc"+(gradSeq++);
    const strong = dark; // "Fuerte" = más velo
    const s0=strong?0.22:0.06, s1=strong?0.48:0.30, s2=strong?0.95:0.78;
    defs += `<linearGradient id="${scId}" x1="0" y1="0" x2="0" y2="1">`
      +`<stop offset="0" stop-color="#0b1a2e" stop-opacity="${s0}"/>`
      +`<stop offset="0.5" stop-color="#0b1a2e" stop-opacity="${s1}"/>`
      +`<stop offset="1" stop-color="#0b1a2e" stop-opacity="${s2}"/></linearGradient>`;
    bgExtra += `<rect x="0" y="0" width="${CANVAS}" height="${CANVAS}" fill="url(#${scId})"/>`;
  }

  // LOGO (top-left)
  const logoH=52, logoTop=86;
  const lg=logoSvg(PAD, logoTop, logoH, visualDark, custom);
  body+=lg.svg; if(lg.defs)defs+=lg.defs;

  // FOOTER
  const footSize=25, footY=CANVAS-70;
  const pn=String(pageNum).padStart(2,"0"), tt=String(total).padStart(2,"0");
  const fL=lineToSvg(400,[{text:`${pn} / ${tt}`,grad:false}],PAD,footY,footSize,footCol);
  const fRtext="andes.energy";
  const fRw=measure(600,fRtext,footSize);
  const fR=lineToSvg(600,[{text:fRtext,grad:false}],CANVAS-PAD-fRw,footY,footSize,footCol);
  body+=fL.paths+fR.paths;

  /* ---------- layout por plantilla ---------- */
  if(t==="imagen"){
    // full-bleed: bloque de texto anclado abajo, sobre el velo
    const es=27;
    const eyebrow=stripStars(slide.eyebrow||"");
    const headLines=(slide.headline||"").split("\n");
    const headSize=fitHeadline(700, headLines.map(stripStars), USABLE, 78, 40);
    const subLines = stripStars(slide.subtitle)? wrapLines(300,slide.subtitle,38,USABLE):[];
    const subSize=38;
    const eyeH = eyebrow?capHeight(600,es):0;
    const gapE = eyebrow?es*0.9:0;
    const hHead = headLines.length*headSize*1.0;
    const gapS = subLines.length?32:0;
    const hSub = subLines.length*subSize*1.28;
    const totalH = eyeH+gapE+hHead+gapS+hSub;
    const blockBottom = footY - footSize - 48;
    let y = Math.max(blockBottom - totalH, logoTop+logoH+40);
    if(eyebrow){
      const baseY=y+eyeH;
      const e=lineToSvg(600,segsTrack(eyebrow.toUpperCase(),3),PAD,baseY,es,eyeCol);
      body+=e.paths; if(e.defs)defs+=e.defs;
      y=baseY+es*0.9;
    }
    const hl=renderHeadlineLines(headLines,PAD,y,headSize,inkCol);
    body+=hl.body; defs+=hl.defs; y=hl.bottom;
    if(subLines.length){
      y+=32;
      const sub=renderSubLines(subLines,PAD,y,subSize,subCol);
      body+=sub.body; y=sub.bottom;
    }
  } else if(t==="foto"){
    // bloque de texto anclado arriba + foto abajo
    let y=logoTop+logoH+58; // start below logo
    // label (eyebrow) — en foto va como kicker pegado al logo (bajo el wordmark) en refs; aquí lo ponemos arriba del titular
    const eyebrow=stripStars(slide.eyebrow||"");
    if(eyebrow){
      const es=27; const baseY=y+capHeight(600,es);
      const e=lineToSvg(600,segsTrack(eyebrow.toUpperCase(),3),PAD,baseY,es,eyeCol);
      body+=e.paths; if(e.defs)defs+=e.defs;
      y=baseY+es*0.9;
    }
    // titular
    y+=6;
    const hl=renderHeadline(slide.headline,PAD,y,72,inkCol);
    body+=hl.body; defs+=hl.defs; y=hl.bottom;
    // subtitulo
    if(stripStars(slide.subtitle)){
      y+=34;
      const sub=renderSub(slide.subtitle,PAD,y,38,subCol);
      body+=sub.body; y=sub.bottom;
    }
    // foto
    const imgTop=Math.max(y+40, 560);
    const imgBot=footY-footSize-30;
    const imgH=imgBot-imgTop, imgW=USABLE;
    const clipId="clip"+(gradSeq++);
    defs+=`<clipPath id="${clipId}"><rect x="${PAD}" y="${imgTop}" width="${imgW}" height="${imgH}" rx="26" ry="26"/></clipPath>`;
    if(slide.image){
      body+=`<image href="${slide.image}" x="${PAD}" y="${imgTop}" width="${imgW}" height="${imgH}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${clipId})"/>`;
    }else{
      body+=`<rect x="${PAD}" y="${imgTop}" width="${imgW}" height="${imgH}" rx="26" fill="${dark?'#122139':'#e7ebf2'}"/>`;
      const ph="Sube una imagen"; const phw=measure(400,ph,26);
      body+=lineToSvg(400,[{text:ph,grad:false}],PAD+(imgW-phw)/2,imgTop+imgH/2,26,dark?C.subDark:C.subLight).paths;
    }
  } else {
    // plantillas centradas verticalmente
    const topSafe=logoTop+logoH+50, botSafe=footY-footSize-40;
    const parts=[]; // {type,h,render(yTop)->{body,defs,bottom}}
    const eyebrow=stripStars(slide.eyebrow||"");
    // medir alturas
    let eyeH=0, headLines=[], headSize=0, subLines=[], subSize=38, datoSize=0, ctaH=0, notaH=0;
    const es=27;
    if(eyebrow) eyeH=capHeight(600,es);
    // HEADLINE / DATO
    if(t==="dato"){
      const dato=stripStars(slide.dato||"15–36%");
      datoSize=fitSize(800,dato,USABLE,220,90);
      headSize=datoSize;
    } else {
      const base = (t==="portada")?80:84;
      const src=(slide.headline||"").split("\n").map(l=>stripStars(l));
      headSize=fitHeadline(700,src,USABLE,base,40);
      headLines=(slide.headline||"").split("\n");
    }
    // SUB
    let subBottomExtra=0;
    if(stripStars(slide.subtitle)){ subLines=wrapLines(300,slide.subtitle,subSize,USABLE); }
    // CTA (cierre)
    let ctaSize=52;
    // NOTA (portada)
    let notaSize=30;

    // total height calc
    const lineGap=1.02;
    let hHead = (t==="dato") ? capHeight(800,datoSize) : headLines.length*headSize*lineGap - (headSize*(lineGap-1));
    if(t!=="dato"){ hHead = headLines.length*headSize*1.0; }
    let hSub = subLines.length? subLines.length*subSize*1.28 : 0;
    let hCta = (t==="cierre" && stripStars(slide.cta)) ? capHeight(700,ctaSize) : 0;
    let hNota= (t==="portada" && stripStars(slide.nota)) ? notaSize : 0;
    const gapE=eyebrow?(es*0.9):0;
    const gapS=hSub?34:0;
    const gapC=hCta?46:0;
    const gapN=hNota?44:0;
    const totalH = eyeH+gapE + hHead + gapS+hSub + gapC+hCta + gapN+hNota;
    let y=topSafe + Math.max(0,(botSafe-topSafe-totalH)/2);

    // EYEBROW
    if(eyebrow){
      const baseY=y+eyeH;
      const e=lineToSvg(600,segsTrack(eyebrow.toUpperCase(),3),PAD,baseY,es,eyeCol);
      body+=e.paths; if(e.defs)defs+=e.defs;
      y=baseY+es*0.9;
    }
    // HEADLINE or DATO
    if(t==="dato"){
      const baseY=y+capHeight(800,datoSize);
      const segs=parseSegs("*"+(slide.dato||"15–36%")+"*"); // todo en degradado
      const dd=lineToSvg(800,segs,PAD,baseY,datoSize,inkCol);
      body+=dd.paths; defs+=dd.defs;
      y=baseY+datoSize*0.12;
    } else {
      const hl=renderHeadlineLines(headLines,PAD,y,headSize,inkCol);
      body+=hl.body; defs+=hl.defs; y=hl.bottom;
    }
    // SUB
    if(subLines.length){
      y+=34;
      const sub=renderSubLines(subLines,PAD,y,subSize,subCol);
      body+=sub.body; y=sub.bottom;
    }
    // CTA
    if(t==="cierre" && stripStars(slide.cta)){
      y+=46;
      const r=renderCta(slide.cta,PAD,y,ctaSize,emojis);
      body+=r.body; defs+=r.defs; y=r.bottom;
    }
    // NOTA
    if(t==="portada" && stripStars(slide.nota)){
      y+=44;
      const baseY=y+notaSize*0.78;
      const txt=stripStars(slide.nota);
      const nn=lineToSvg(400,[{text:txt+"  ",grad:false}],PAD,baseY,notaSize,subCol);
      body+=nn.paths;
      body+=arrow(PAD+nn.width, baseY-notaSize*0.28, notaSize, subCol);
      y=baseY;
    }
  }

  const svg=`<svg viewBox="0 0 ${CANVAS} ${CANVAS}" xmlns="http://www.w3.org/2000/svg">`
    +`<rect width="${CANVAS}" height="${CANVAS}" fill="${bg}"/>`
    +`<defs>${defs}</defs>${bgExtra}${body}</svg>`;
  return {svg, emojis, bg};
}

/* eyebrow con tracking: insertamos micro-espacios reales no; usamos segsTrack para separar por letra */
function segsTrack(text, trackPx){
  // implementamos tracking dibujando cada glifo con avance extra vía espacios finos:
  // en su lugar devolvemos un solo segmento; el tracking se maneja en lineToSvgTracked
  return [{text,grad:false,track:trackPx}];
}
/* override lineToSvg para soportar tracking en eyebrow */
const _lineToSvg = lineToSvg;
lineToSvg = function(weight,segs,x0,baseY,size,solid){
  const hasTrack = segs.some(s=>s.track);
  if(!hasTrack) return _lineToSvg(weight,segs,x0,baseY,size,solid);
  const f=FONTS[weight]; const s=size/f.unitsPerEm; let x=x0, paths="";
  for(const seg of segs){
    const tr=(seg.track||0);
    for(const ch of seg.text){
      const g=f.charToGlyph(ch);
      paths+=`<path d="${g.getPath(x,baseY,size).toPathData(2)}" fill="${solid}"/>`;
      x += g.advanceWidth*s + tr;
    }
  }
  return {paths,defs:"",width:x-x0};
};

function fitHeadline(weight, lines, maxW, base, min){
  let size=base;
  while(size>min){
    let ok=true;
    for(const l of lines){ if(measure(weight,l,size)>maxW){ok=false;break;} }
    if(ok)break; size-=1;
  }
  return size;
}
function fitSize(weight, text, maxW, base, min){
  let size=base;
  while(size>min && measure(weight,text,size)>maxW) size-=2;
  return size;
}

function renderHeadlineLines(lines, x, yTop, size, ink){
  let body="",defs="",y=yTop;
  for(const line of lines){
    const baseY=y+capHeight(700,size);
    const r=lineToSvg(700,parseSegs(line),x,baseY,size,ink);
    body+=r.paths; if(r.defs)defs+=r.defs;
    y=baseY+size*(1.0-0.72); // move to next line top (line-height ~1.0 of cap)
    y=baseY+size*0.30;
  }
  return {body,defs,bottom:y};
}
function renderHeadline(text,x,yTop,size,ink){
  const lines=(text||"").split("\n");
  return renderHeadlineLines(lines,x,yTop,size,ink);
}
function renderSubLines(lines,x,yTop,size,col){
  let body="",y=yTop;
  for(const line of lines){
    const baseY=y+capHeight(300,size)*0.98;
    body+=lineToSvg(300,[{text:stripStars(line),grad:false}],x,baseY,size,col).paths;
    y=baseY+size*0.42;
  }
  return {body,bottom:y};
}
function renderSub(text,x,yTop,size,col){ return renderSubLines(wrapLines(300,text,size,USABLE),x,yTop,size,col); }

function renderCta(text,x,yTop,size,emojis){
  // separar emoji final (👇 u otros) del texto
  const raw=stripStars(text);
  const m=raw.match(/^(.*?)(\s*)([\u{1F000}-\u{1FAFF}☀-➿️]+)\s*$/u);
  let txt=raw, emoji=null;
  if(m){ txt=m[1]; emoji=m[3]; }
  const baseY=yTop+capHeight(700,size);
  const segs=parseSegs("*"+txt+"*");
  const r=lineToSvg(700,segs,x,baseY,size,C.emerald);
  let body=r.paths, defs=r.defs;
  if(emoji){ emojis.push({char:emoji, x:x+r.width+size*0.28, baseY:baseY, size:size}); }
  return {body,defs,bottom:baseY+size*0.2};
}

  portada:{template:"portada",dark:true, eyebrow:"Andes Energy", headline:"Tu empresa está\n*botando dinero.*", subtitle:"Y ni siquiera lo puedes ver.", nota:"desliza"},
  texto:{template:"texto",dark:false, eyebrow:"El problema", headline:"Cada mes llega la\nfactura de luz.", subtitle:"Un número grande. Ya pagado. Sin explicación de a dónde se fue."},
  foto:{template:"foto",dark:false, eyebrow:"Consumo fantasma", headline:"Se llama *consumo*\n*fantasma.*", subtitle:"Equipos mal calibrados, fugas, máquinas encendidas de noche. Corre 24/7 y nadie lo mide.", image:null},
  dato:{template:"dato",dark:false, eyebrow:"El costo real", dato:"15–36%", subtitle:"de tu energía se desperdicia sin que lo notes. Miles de dólares al año, a la basura."},
  cierre:{template:"cierre",dark:true, eyebrow:"Empieza hoy", headline:"¿Cuánto está\nbotando tu empresa?", subtitle:"Diagnóstico energético gratis.", cta:"andes.energy 👇"},
  imagen:{template:"imagen",dark:true, eyebrow:"Andes Energy", headline:"La energía que\n*no ves* te cuesta.", subtitle:"Monitoreo en tiempo real de cada equipo.", image:null}
};
const TMPL_META={
  portada:{name:"Portada",sub:"Fondo oscuro · apertura del carrusel"},
  texto:{name:"Texto",sub:"Fondo claro · titular + subtítulo"},
  foto:{name:"Con foto",sub:"Fondo claro · imagen inferior"},
  dato:{name:"Dato",sub:"Fondo claro · cifra gigante"},
  cierre:{name:"Cierre / CTA",sub:"Fondo oscuro · llamado a la acción"},
  imagen:{name:"Imagen completa",sub:"Foto a sangre completa · texto encima"}
};
let STATE={slides:[],selected:0,totalPages:"auto"};
let BRAND={light:null,dark:null};
let uid=1;

function newSlide(t){ return Object.assign({id:uid++}, JSON.parse(JSON.stringify(DEFAULTS[t]))); }
function total(){ return STATE.totalPages==="auto"?STATE.slides.length:parseInt(STATE.totalPages)||STATE.slides.length; }

function save(){
  try{ localStorage.setItem("ae_gen_v1", JSON.stringify({STATE,BRAND})); }
  catch(e){
    try{ const s=JSON.parse(JSON.stringify(STATE)); s.slides.forEach(sl=>sl.image=null); localStorage.setItem("ae_gen_v1",JSON.stringify({STATE:s,BRAND:{light:null,dark:null}})); }catch(_){}
  }
}
function load(){
  try{ const d=JSON.parse(localStorage.getItem("ae_gen_v1")); if(d&&d.STATE&&d.STATE.slides.length){ STATE=d.STATE; BRAND=d.BRAND||BRAND; uid=Math.max(...STATE.slides.map(s=>s.id||0))+1; return true; } }catch(e){}
  return false;
}

/* ---- render preview + thumbs ---- */
function renderStage(){
  const sl=STATE.slides[STATE.selected]; if(!sl){document.getElementById('stageSvg').innerHTML='';return;}
  const {svg,emojis}=buildSlide(sl, STATE.selected+1, total());
  const host=document.getElementById('stageSvg');
  host.innerHTML=svg;
  // pintar emojis como <text> en el DOM (se ven en preview)
  const svgEl=host.querySelector('svg');
  emojis.forEach(e=>{
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",e.x); t.setAttribute("y",e.baseY);
    t.setAttribute("font-size",e.size);
    t.setAttribute("font-family",'"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif');
    t.textContent=e.char; svgEl.appendChild(t);
  });
}
function renderThumbs(){
  const box=document.getElementById('thumbs'); box.innerHTML='';
  if(!STATE.slides.length){ box.innerHTML='<div class="empty">Añade tu primera slide con los botones de arriba.</div>'; return; }
  STATE.slides.forEach((sl,i)=>{
    const {svg}=buildSlide(sl,i+1,total());
    const div=document.createElement('div');
    div.className='thumb'+(i===STATE.selected?' sel':'');
    div.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span>${svg}
      <div class="ops">
        <button title="Subir" data-op="up">↑</button>
        <button title="Duplicar" data-op="dup">⧉</button>
        <button title="Eliminar" data-op="del">✕</button>
      </div>`;
    div.addEventListener('click',ev=>{
      const op=ev.target.getAttribute&&ev.target.getAttribute('data-op');
      if(op){ ev.stopPropagation(); doOp(op,i); return; }
      STATE.selected=i; refresh();
    });
    box.appendChild(div);
  });
}
function doOp(op,i){
  if(op==='up'&&i>0){ const a=STATE.slides; [a[i-1],a[i]]=[a[i],a[i-1]]; STATE.selected=i-1; }
  else if(op==='dup'){ const c=JSON.parse(JSON.stringify(STATE.slides[i])); c.id=uid++; STATE.slides.splice(i+1,0,c); STATE.selected=i+1; }
  else if(op==='del'){ STATE.slides.splice(i,1); STATE.selected=Math.max(0,Math.min(STATE.selected,STATE.slides.length-1)); }
  refresh();
}

/* ---- editor ---- */
function renderEditor(){
  const ed=document.getElementById('editor'); const sl=STATE.slides[STATE.selected];
  if(!sl){ ed.innerHTML='<div class="empty">Sin slide seleccionada.</div>'; return; }
  const m=TMPL_META[sl.template];
  let h=`<p class="tmpl-name">${m.name}</p><p class="tmpl-sub">${m.sub}</p>`;
  const isImg = sl.template==='imagen';
  const toggleLbl = isImg?'Velo':'Fondo';
  const optA = isImg?'Suave':'Claro', optB = isImg?'Fuerte':'Oscuro';
  h+=`<div class="row"><label style="font-size:12px;font-weight:600">${toggleLbl}</label>
      <div class="seg"><button data-dark="0" class="${!sl.dark?'on':''}">${optA}</button><button data-dark="1" class="${sl.dark?'on':''}">${optB}</button></div></div>`;
  const F=(key,label,hint,area)=>{
    const v=esc(sl[key]||'');
    return `<div class="field"><label>${label}${hint?` <span class="hint">${hint}</span>`:''}</label>`+
      (area?`<textarea data-k="${key}">${v}</textarea>`:`<input type="text" data-k="${key}" value="${v}">`)+`</div>`;
  };
  const eyebrowLbl = sl.template==='foto'?'Etiqueta':'Eyebrow';
  if(sl.template!=='dato' || true) h+=F('eyebrow',eyebrowLbl,'texto corto en mayúsculas');
  if(sl.template==='dato'){
    h+=F('dato','Dato / cifra','ej. 15–36% · va en degradado');
  }else{
    h+=F('headline','Titular','envuelve en *asteriscos* lo que va en degradado · Enter = salto de línea',true);
  }
  h+=F('subtitle','Subtítulo','',true);
  if(sl.template==='cierre') h+=F('cta','Línea de cierre','ej. andes.energy 👇 · el emoji se conserva');
  if(sl.template==='portada') h+=F('nota','Nota inferior','ej. desliza · se le añade la flecha →');
  if(sl.template==='foto' || isImg){
    const hint = isImg?'llena todo el lienzo (se puede reemplazar)':'se recorta a la mitad inferior';
    const prev = sl.image || (isImg?DEFAULT_PHOTO:'');
    h+=`<div class="field"><label>Imagen <span class="hint">${hint}</span></label>
      <div class="filepick"><img class="thumbimg" id="imgPrev" src="${prev}" alt=""><input type="file" accept="image/*" id="imgFile"></div></div>`;
  }
  h+=`<div class="field" style="margin-top:22px"><label>Total de páginas del carrusel <span class="hint">para el pie 0X / 0Y</span></label>
      <input type="text" id="totalPages" value="${STATE.totalPages==='auto'?'':STATE.totalPages}" placeholder="auto (${STATE.slides.length})"></div>`;
  h+=`<div class="tipbox"><b>Tip:</b> el <b>*degradado*</b> va en el titular envolviendo palabras entre asteriscos. Los <b>saltos de línea</b> los controlas tú con Enter. El titular se autoajusta para no desbordarse.</div>`;
  ed.innerHTML=h;

  ed.querySelectorAll('[data-k]').forEach(el=>{
    el.addEventListener('input',()=>{ sl[el.getAttribute('data-k')]=el.value; renderStage(); scheduleThumb(); save(); });
  });
  ed.querySelectorAll('[data-dark]').forEach(b=>{
    b.addEventListener('click',()=>{ sl.dark=b.getAttribute('data-dark')==='1'; refresh(); });
  });
  const tp=ed.querySelector('#totalPages');
  if(tp) tp.addEventListener('input',()=>{ STATE.totalPages=tp.value.trim()===''?'auto':tp.value.trim(); renderStage(); scheduleThumb(); save(); });
  const imgFile=ed.querySelector('#imgFile');
  if(imgFile) imgFile.addEventListener('change',e=>readImg(e.target.files[0],d=>{ sl.image=d; ed.querySelector('#imgPrev').src=d; renderStage(); scheduleThumb(); save(); }));
}
let thumbTimer=null;
function scheduleThumb(){ clearTimeout(thumbTimer); thumbTimer=setTimeout(renderThumbs,350); }
function readImg(file,cb){ if(!file)return; const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file); }

function refresh(){ renderStage(); renderThumbs(); renderEditor(); save(); }

/* ---- export ---- */
function svgToPng(svg, emojis, scale, cb){
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=CANVAS*scale; cv.height=CANVAS*scale;
    const ctx=cv.getContext('2d');
    ctx.drawImage(img,0,0,cv.width,cv.height);
    emojis.forEach(e=>{
      ctx.font=`${e.size*scale}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
      ctx.textBaseline='alphabetic';
      ctx.fillText(e.char, e.x*scale, e.baseY*scale);
    });
    cv.toBlob(b=>cb(b),'image/png');
  };
  img.onerror=()=>cb(null);
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function downloadBlob(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); }

function dlOne(){
  const sl=STATE.slides[STATE.selected]; if(!sl)return;
  const {svg,emojis}=buildSlide(sl,STATE.selected+1,total());
  svgToPng(svg,emojis,2,b=>{ if(b)downloadBlob(b,`andes-${String(STATE.selected+1).padStart(2,'0')}.png`); });
}
async function dlAll(){
  if(!STATE.slides.length)return;
  const btn=document.getElementById('btnDlAll'); btn.disabled=true; const orig=btn.textContent; btn.textContent='Generando…';
  const zip=new JSZip();
  for(let i=0;i<STATE.slides.length;i++){
    const {svg,emojis}=buildSlide(STATE.slides[i],i+1,total());
    const blob=await new Promise(res=>svgToPng(svg,emojis,2,res));
    if(blob) zip.file(`andes-${String(i+1).padStart(2,'0')}.png`, blob);
  }
  const out=await zip.generateAsync({type:'blob'});
  downloadBlob(out,'andes-carrusel.zip');
  btn.disabled=false; btn.textContent=orig;
}

/* ---- brand modal ---- */
function openBrand(){ document.getElementById('brandModal').classList.add('open'); syncBrandPrev(); }
function syncBrandPrev(){ document.getElementById('logoLightPrev').src=BRAND.light?BRAND.light.src:''; document.getElementById('logoDarkPrev').src=BRAND.dark?BRAND.dark.src:''; }
function imgMeta(dataUrl,cb){ const im=new Image(); im.onload=()=>cb({src:dataUrl,w:im.naturalWidth,h:im.naturalHeight}); im.src=dataUrl; }

/* ---- top bar logo ---- */
function topLogo(){
  const el=document.getElementById('topLogo');
  const scale=26/LOGO_VB.h; const mw=LOGO_VB.w*scale;
  el.innerHTML=`<svg viewBox="${LOGO_VB.x} ${LOGO_VB.y} ${LOGO_VB.w} ${LOGO_VB.h}" style="height:26px;width:${mw}px">
    <path d="${LOGO_A}" fill="${C.indigo}"/><path d="${LOGO_E1}" fill="${C.emerald}"/><path d="${LOGO_E2}" fill="${C.emerald}"/></svg>
    <span>andes<span style="color:${C.indigo}">.</span>energy</span><span class="tag">generador</span>`;
}

/* ---- init ---- */
function boot(){
  for(const w of [300,400,600,700,800]){ FONTS[w]=opentype.parse(b64buf(FONT_B64[w])); }
  topLogo();
  if(!load()){
    // seed carrusel de ejemplo (los 5 tipos)
    ["portada","texto","foto","dato","cierre"].forEach(t=>STATE.slides.push(newSlide(t)));
    STATE.selected=0;
  }
  document.getElementById('loading').style.display='none';

  document.getElementById('addMenu').addEventListener('click',e=>{
    const t=e.target.getAttribute('data-t'); if(!t)return;
    STATE.slides.push(newSlide(t)); STATE.selected=STATE.slides.length-1; refresh();
  });
  document.getElementById('btnDlOne').addEventListener('click',dlOne);
  document.getElementById('btnDlAll').addEventListener('click',dlAll);
  document.getElementById('btnBrand').addEventListener('click',openBrand);
  document.getElementById('brandDone').addEventListener('click',()=>document.getElementById('brandModal').classList.remove('open'));
  document.getElementById('brandModal').addEventListener('click',e=>{ if(e.target.id==='brandModal') e.currentTarget.classList.remove('open'); });
  document.getElementById('logoReset').addEventListener('click',()=>{ BRAND={light:null,dark:null}; syncBrandPrev(); refresh(); });
  document.getElementById('logoLight').addEventListener('change',e=>readImg(e.target.files[0],d=>imgMeta(d,m=>{BRAND.light=m;syncBrandPrev();refresh();})));
  document.getElementById('logoDark').addEventListener('change',e=>readImg(e.target.files[0],d=>imgMeta(d,m=>{BRAND.dark=m;syncBrandPrev();refresh();})));

  refresh();
}
window.addEventListener('load',()=>{ if(window.opentype) boot(); else { const iv=setInterval(()=>{ if(window.opentype){clearInterval(iv);boot();} },50); } });
</script>
